name: arrowquest
description: "ArrowQuest: Escape Puzzle — a 100-level arrow-escaping puzzle game."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Kept as ranges so the newest version compatible with the runner's Flutter
  # SDK is resolved instead of a hard pin failing to resolve.
  shared_preferences: '>=2.2.0 <3.0.0'
  # 8.x is the line that builds against the Gradle version the current Flutter
  # stable template ships (5.x used `configurations.all`, removed in Gradle 9).
  google_mobile_ads: '>=8.0.0 <9.0.0'
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/levels/levels.json
    - assets/branding/
    - assets/sounds/
