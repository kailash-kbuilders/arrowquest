name: arrowquest
description: "ArrowQuest: Escape Puzzle — a 100-level arrow-escaping puzzle game."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Kept as a range so the newest version compatible with the runner's Flutter
  # SDK is resolved instead of a hard pin failing to resolve.
  shared_preferences: '>=2.2.0 <3.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/levels/levels.json
    - assets/branding/
