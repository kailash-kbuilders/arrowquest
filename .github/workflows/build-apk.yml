name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # The repo deliberately ships no android/ folder (a partial Gradle project
      # is worse than none). Build it in a throwaway project and copy only the
      # android/ folder in, so lib/ and pubspec.yaml can never be overwritten.
      - name: Generate android folder if missing
        run: |
          if [ ! -d "android" ]; then
            TMP="$(mktemp -d)"
            flutter create "$TMP/seed" --platforms=android --project-name arrowquest
            cp -r "$TMP/seed/android" ./android
            rm -rf "$TMP"
          fi

      # `flutter build apk --no-shrink` no longer turns R8 off: the flag is gone
      # from this Flutter version and the Gradle plugin enables minification for
      # release builds by default. The plugin reads a `shrink` Gradle property,
      # so the only reliable switch is to set it here. Without this, R8 strips
      # and renames the AdMob SDK and the app dies the moment it is opened.
      - name: Disable R8 shrinking
        run: |
          GP=android/gradle.properties
          if ! grep -q '^shrink=' "$GP"; then
            printf '\n# Keep R8 minification and resource shrinking off.\nshrink=false\n' >> "$GP"
          fi
          cat "$GP"

      # Give the app a repo-specific applicationId / namespace and label.
      #
      # NOTE: compileSdk is deliberately left alone. The Flutter template sets
      # `compileSdk = flutter.compileSdkVersion` (36 on current stable) and the
      # plugins compile against that same value; pinning it lower is exactly
      # what makes the "AAR metadata" check fail.
      - name: Configure Android project
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          repo = os.environ.get("GITHUB_REPOSITORY", "app")
          app_id = "com.example." + repo.split("/")[-1]

          for name in ("android/app/build.gradle", "android/app/build.gradle.kts"):
              path = pathlib.Path(name)
              if not path.exists():
                  continue
              text = path.read_text()
              text = re.sub(r'(applicationId[ \t]*=?[ \t]*)"[^"]*"',
                            lambda m: m.group(1) + '"' + app_id + '"', text)
              text = re.sub(r'(namespace[ \t]*=?[ \t]*)"[^"]*"',
                            lambda m: m.group(1) + '"' + app_id + '"', text)
              path.write_text(text)
              print("configured", name, "->", app_id)

          manifest = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              m = manifest.read_text()
              m = re.sub(r'android:label="[^"]*"', 'android:label="ArrowQuest"', m)
              manifest.write_text(m)
              print("labelled the app as ArrowQuest")
          PY

      # AdMob needs the app id declared in the manifest, plus INTERNET for the
      # release build. Both live outside android/, which is regenerated each run.
      - name: Add AdMob app id and INTERNET permission
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          if not p.exists():
              raise SystemExit("AndroidManifest.xml not found")
          s = p.read_text()
          if "android.permission.INTERNET" not in s:
              s = s.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.INTERNET"/>\n    <application',
                  1,
              )
          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              meta = (
                  '        <meta-data\n'
                  '            android:name="com.google.android.gms.ads.APPLICATION_ID"\n'
                  '            android:value="ca-app-pub-3940256099942544~3347511713"/>\n'
                  '    </application>'
              )
              s = s.replace("</application>", meta, 1)
          p.write_text(s)
          print("AdMob app id + INTERNET permission in place")
          PY

      # The launcher icons live outside android/ because that folder is
      # regenerated on every run, so they are copied in each time.
      - name: Install launcher icons
        run: |
          RES="android/app/src/main/res"
          if [ ! -d "branding/android" ]; then
            echo "::error::branding/android is missing — the app would ship with the Flutter template icon"
            exit 1
          fi
          mkdir -p "$RES/drawable" "$RES/mipmap-anydpi-v26"
          for d in branding/android/mipmap-*/; do
            name="$(basename "$d")"
            mkdir -p "$RES/$name"
            cp -f "$d"*.png "$RES/$name/"
          done
          cp -f branding/android/ic_launcher_background.xml "$RES/drawable/ic_launcher_background.xml"
          cp -f branding/android/ic_launcher.xml "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          cp -f branding/android/ic_launcher.xml "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          echo "installed launcher icons:"
          find "$RES" -name 'ic_launcher*' | sort

      - name: Show Android SDK configuration
        run: |
          grep -rnE "compileSdk|targetSdk|minSdk|ndkVersion" android/app/build.gradle* || true

      # Belt and braces: these rules are only consulted if R8 is ever switched
      # back on, and they are what keeps the ads SDK alive when it is.
      - name: Gradle fixes (R8 keep rules)
        run: |
          cat > android/app/proguard-rules.pro <<'EOF'
          -dontwarn io.flutter.**
          -keep class io.flutter.** { *; }
          -keep class io.flutter.plugins.** { *; }
          -keep class com.google.android.gms.** { *; }
          -dontwarn com.google.android.gms.**
          -keep class com.google.android.ump.** { *; }
          -dontwarn com.google.android.ump.**
          EOF
          cat android/app/proguard-rules.pro

      # Print everything that has to be right, and fail loudly if it is not.
      - name: Verify Android configuration
        run: |
          echo "--- gradle.properties ---"
          cat android/gradle.properties
          echo "--- shrink property ---"
          grep -n '^shrink=' android/gradle.properties || (echo "shrink property missing" && exit 1)
          echo "--- manifest ---"
          grep -nE "APPLICATION_ID|INTERNET" android/app/src/main/AndroidManifest.xml
          echo "--- launcher icons ---"
          find android/app/src/main/res -name 'ic_launcher*' | sort

      - name: Install dependencies
        run: flutter pub get

      # Formatting is applied and then verified, so a style difference can never
      # block a release build.
      - name: Format
        run: |
          dart format .
          dart format --output=none --set-exit-if-changed .

      # Only real analyzer *errors* fail the build; style infos/warnings are
      # reported in the log but do not block the APK.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      # --no-shrink skips R8 minification, the biggest cause of release build failures.
      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # A manual run (or a v* tag) also publishes the APK to a GitHub Release.
      - name: Publish APK to GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'apk-latest' }}
          name: APK build
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: build/app/outputs/flutter-apk/app-release.apk
